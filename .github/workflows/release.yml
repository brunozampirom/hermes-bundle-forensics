name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          URL=https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL --retry 3 -o zig.tar.xz "$URL"
          echo "$SHA  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - run: zig build test

      # Zig cross-compiles every target from this one runner, so there is no
      # build matrix and no per-OS runner to keep in sync.
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist pkg
          for t in x86_64-linux aarch64-linux x86_64-macos aarch64-macos \
                   x86_64-windows aarch64-windows; do
            zig build -Dtarget="$t" -Doptimize=ReleaseFast --prefix "out/$t"
            case "$t" in *windows) ext=.exe ;; *) ext= ;; esac
            name="hbcinfo-$VERSION-$t"
            mkdir -p "pkg/$name"
            cp "out/$t/bin/hbcinfo$ext" "pkg/$name/"
            cp README.md LICENSE "pkg/$name/"
            case "$t" in
              *windows) (cd pkg && zip -qr "../dist/$name.zip" "$name") ;;
              *)        tar -czf "dist/$name.tar.gz" -C pkg "$name" ;;
            esac
          done
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      # Proves the published binary actually starts. With no arguments hbcinfo
      # prints usage and exits 2, so any other code means it is broken.
      - name: Smoke test
        run: |
          set +e
          out/x86_64-linux/bin/hbcinfo > /dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
