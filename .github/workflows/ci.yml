name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed by hand rather than through a setup action: the toolchain is
      # pinned to an exact version and verified against its published checksum,
      # which is the same standard the tool itself applies to what it parses.
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          URL=https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL --retry 3 -o zig.tar.xz "$URL"
          echo "$SHA  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - run: zig version
      - run: zig build
      - run: zig build test --summary all
      - run: zig fmt --check src build.zig

      # The help text and the README have drifted apart twice, each time in a
      # different direction, and neither time did anything fail. Every option
      # the binary accepts has to appear in the README's usage block.
      - name: Assert the README documents every option
        run: |
          set -eu
          ./zig-out/bin/hbcinfo > help.txt 2>&1 || true
          missing=0
          for flag in $(grep -oE '^\s+--[a-z-]+' help.txt | tr -d ' '); do
            if ! grep -q -- "$flag" README.md; then
              echo "$flag is in the help text but not in the README"
              missing=1
            fi
          done
          test "$missing" -eq 0
